<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="/main.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{ navbar.html::navbar }"></div>


<h4>수정페이지</h4>
<img th:src="${pre.image != null ? pre.image : '/default-image.png'}">

<form th:action="@{/edit/{id}(id=${ pre.id })}" method="POST">
    <input name="title" th:value="${ pre.title }">
    <input name="price" th:value="${ pre.price }">

    <input type="hidden" name="image" id="image-url">
    <input type="file" onchange="getURL(this)">
    <button type="submit">전송</button>
</form>

<script>
    /*
     수정 시 이미지 처리
     - 새로운 파일을 선택하면 S3의 새로운 경로로 업로드 수행.
     - 업로드 성공 시, <img> 태그의 src를 교체하여 사용자에게 시각적으로 알려줌.
     */
    async function getURL(e){
        let name = encodeURIComponent(e.files[0].name)
        let result = await fetch('/presigned-url?filename=' + name);
        result = await result.text();

        let 결과 = await fetch(result, {
            method: 'PUT',
            body: e.files[0]
        })

        console.log(결과.url.split("?")[0])
        if(결과.ok){
            // 새로운 S3 주소로 미리보기 이미지 교체 및 hidden input 값 업데이트
            document.querySelector('img').src = 결과.url.split("?")[0]
            document.getElementById('image-url').value = 결과.url.split("?")[0]
        }
    }
</script>

</body>
</html>
